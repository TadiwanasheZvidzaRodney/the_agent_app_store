services:
  - type: web
    name: the-hub-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && prisma generate"
    startCommand: "prisma db push && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
